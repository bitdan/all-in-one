spring:
  profiles:
    active: @profile.active@
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://43.156.83.246:5432/tool_hub}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:dudu0.0@}
    hikari:
      pool-name: linger-postgres-pool
      maximum-pool-size: ${POSTGRES_POOL_SIZE:20}
      minimum-idle: ${POSTGRES_MIN_IDLE:2}
  flyway:
    enabled: false

toolhub:
  cors-origins: ${TOOL_HUB_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://tool.linger.host,https://tool.linger.host}
  captcha-ttl-seconds: ${TOOL_HUB_CAPTCHA_TTL_SECONDS:300}
  chat-history-limit: ${TOOL_HUB_CHAT_HISTORY_LIMIT:100}
  chat-history-ttl-seconds: ${TOOL_HUB_CHAT_HISTORY_TTL_SECONDS:604800}
  game-room-ttl-seconds: ${TOOL_HUB_GAME_ROOM_TTL_SECONDS:86400}
  totp-master-key: ${TOOL_HUB_TOTP_MASTER_KEY:}

http:
  client:
    connect-timeout-millis: ${HTTP_CLIENT_CONNECT_TIMEOUT_MILLIS:10000}
    read-timeout-millis: ${HTTP_CLIENT_READ_TIMEOUT_MILLIS:600000}
    write-timeout-millis: ${HTTP_CLIENT_WRITE_TIMEOUT_MILLIS:60000}
    call-timeout-millis: ${HTTP_CLIENT_CALL_TIMEOUT_MILLIS:0}
    max-response-body-bytes: ${HTTP_CLIENT_MAX_RESPONSE_BODY_BYTES:16777216}

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  call-timeout-millis: ${DEEPSEEK_CALL_TIMEOUT_MILLIS:0}
  max-response-body-bytes: ${DEEPSEEK_MAX_RESPONSE_BODY_BYTES:16777216}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${TOOL_HUB_SESSION_TTL_SECONDS:21600}
  active-timeout: -1
  is-concurrent: false
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-log: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 9999
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256


lock4j:
  acquire-timeout: 3000
  expire: 30000
